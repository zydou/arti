[package]
name = "tor-llcrypto"
version = "0.47.0"
authors = ["The Tor Project, Inc.", "Nick Mathewson <nickm@torproject.org>"]
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
homepage = "https://gitlab.torproject.org/tpo/core/arti/-/wikis/home"
description = "Low level cryptography wrappers used by Tor"
keywords = ["tor", "arti", "cryptography"]
categories = ["cryptography"]
repository = "https://gitlab.torproject.org/tpo/core/arti.git/"

[features]
default = []
memquota-memcost = ["tor-memquota-cost"]
full = [
    "memquota-memcost",
    "rng-compat",
    "safelog/full",
    "tor-memquota-cost?/full",
    "tor-error/full",
]

with-openssl = ["openssl", "typenum", "cipher", "__is_nonadditive"]

experimental = ["relay", "hsv3-client", "hsv3-service", "keymgr", "testing"]

# Enable support for cryptography needed to be a Tor relay.
relay = ["cvt-x25519", "__is_experimental"]
# Enable support for cryptography needed to be an onion service v3 client.
hsv3-client = ["__is_experimental"]
# Enable support for cryptography needed to be an onion service v3 service.
hsv3-service = ["__is_experimental"]
# Enable support for cryptography needed for key management.
keymgr = ["cvt-x25519", "__is_experimental"]
# Enable extra support for converting keys to and from x25519
cvt-x25519 = []
# Compatibility support for older versions of the rand crate.
rng-compat = []
# Support for testing functionality, which might expose APIs that are
# not secure to use otherwise.
testing = ["__is_experimental"]

__is_nonadditive = []
__is_experimental = []

[dependencies]
aes = { version = "0.9", features = ["zeroize"] }
base64ct = "1.8.3"
cipher = { version = "0.5.2", optional = true, features = ["zeroize"] }
ctr = { version = "0.10", features = ["zeroize"] }
curve25519-dalek = "5.0"
der-parser = { version = "10", features = ["serialize"] }
derive-deftly = { version = "~1.14.0" }
derive_more = { version = "2.1.1", features = ["full"] }
digest = "0.11.3"
ed25519-dalek = { version = "3.0", features = ["batch", "hazmat"] }
educe = "0.4.23"
hex = "0.4"
openssl = { version = "0.10.81", optional = true }
rand = "0.10.3"
rand_core = "0.10.1"
rand_core_06 = { package = "rand_core", version = "0.6", default-features = false }
rand_jitter = { version = "0.6", features = ["std"] }
reseeding_rng = "0.10.7"
rsa = { version = "0.9.10", features = ["sha2"] }
safelog = { version = "0.10.0", path = "../safelog" }
serde = "1.0.229"
sha1 = "0.11.0"
sha2 = { version = "0.11.1", features = ["oid"] }
sha3 = "0.12.0"
shake = "0.1"
signature = "3"
subtle = "2"
thiserror = "2"
tor-error = { version = "0.47.0", path = "../tor-error" }
tor-memquota-cost = { version = "0.47.0", path = "../tor-memquota-cost", default-features = false, optional = true }
typenum = { version = "1.20.1", optional = true }
visibility = "0.1.1"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
zeroize = "1"

[dev-dependencies]
cipher = "0.5.2"
hex-literal = "1.1"
rand = "0.10.3"
serde_test = "1.0.177"
tor-basic-utils = { path = "../tor-basic-utils", version = "0.47.0" }
[package.metadata.docs.rs]
all-features = true

[target.'cfg(any(target_arch = "x86", target_arch = "x86_64", target_arch = "aarch64"))'.dependencies]
rdrand = "0.9"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rand_chacha = "0.10.0"

[target.wasm32-unknown-unknown.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }
# rand_core 0.6 needs this version of getrandom, and we need to tell it to use
# the js feature.
getrandom_02 = { package = "getrandom", version = "0.2.17", features = ["js"] }
# rand_core 0.9 needs this version of getrandom, and we need to tell it to use
# the wasm_js feature.
getrandom_03 = { package = "getrandom", version = "0.3.4", features = ["wasm_js"] }

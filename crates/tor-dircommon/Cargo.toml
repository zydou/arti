[package]
name = "tor-dircommon"
version = "0.46.0"
authors = [
    "The Tor Project, Inc.",
    "Nick Mathewson <nickm@torproject.org>",
    "Clara Engler <cve@torproject.org>",
]
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
homepage = "https://gitlab.torproject.org/tpo/core/arti/-/wikis/home"
description = "Common primitives for the Tor directory specification"
keywords = ["tor", "arti", "download", "async"]
categories = ["network-programming", "cryptography"]
repository = "https://gitlab.torproject.org/tpo/core/arti.git/"

[package.metadata.docs.rs]
all-features = true

[features]
full = [
    "tor-basic-utils/full",
    "tor-checkable/full",
    "tor-config/full",
    "tor-linkspec/full",
    "tor-llcrypto/full",
    "tor-netdoc/full",
]

experimental = ["dir-plugin-backend"]

dir-plugin-backend = ["__is_experimental", "dep:http", "dep:thiserror", "dep:tor-error"]
__is_experimental = []

[dependencies]
base64ct = "1.8.0"
derive-deftly = { version = "~1.11.4", features = ["full", "beta"] }
getset = "0.1.6"
http = { version = "1.3.1", optional = true }
humantime = "2"
humantime-serde = "1.1.1"
serde = { version = "1.0.103", features = ["derive"] }
thiserror = { version = "2", optional = true }
tor-basic-utils = { path = "../tor-basic-utils", version = "0.46.0" }
tor-checkable = { path = "../tor-checkable", version = "0.46.0" }
tor-config = { path = "../tor-config", version = "0.46.0" }
tor-error = { path = "../tor-error", version = "0.46.0", optional = true }
tor-linkspec = { path = "../tor-linkspec", version = "0.46.0" }
tor-llcrypto = { path = "../tor-llcrypto", version = "0.46.0" }
tor-netdoc = { path = "../tor-netdoc", version = "0.46.0" }
tracing = "0.1.41"

[dev-dependencies]
toml = "1.0.3"

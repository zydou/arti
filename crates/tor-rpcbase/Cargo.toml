[package]
name = "tor-rpcbase"
version = "0.47.0"
edition = "2024"
rust-version = "1.92"
authors = ["The Tor Project, Inc.", "eta <eta@torproject.org>"]
license = "MIT OR Apache-2.0"
homepage = "https://gitlab.torproject.org/tpo/core/arti/-/wikis/home"
description = "Low level functionality for Arti's RPC service"
keywords = ["tor", "arti", "rpc"]
categories = ["asynchronous"]
repository = "https://gitlab.torproject.org/tpo/core/arti.git/"

[dependencies]
derive-deftly = { version = "~1.14.0", features = ["full", "beta"] }
derive_more = { version = "2.1.1", features = ["full"] }
downcast-rs = "2.0.2"
erased-serde = "0.4.10"
extend = "1.2.0"
futures = "0.3.34"
inventory = "0.3.25"
paste = "1.0.15"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2"
tor-async-utils = { path = "../tor-async-utils", version = "0.47.0" }
tor-error = { path = "../tor-error/", version = "0.47.0", features = ["rpc"] }
typetag = "0.2.23"
void = "1"

[dev-dependencies]
assert-impl = "0.1.3"
futures-await-test = "0.3.0"
regex = { version = "1", default-features = false, features = ["std"] }
serde_json = "1.0.154"

[features]
full = ["tor-async-utils/full", "tor-error/full", "describe-methods"]
describe-methods = []

[package.metadata.docs.rs]
all-features = true

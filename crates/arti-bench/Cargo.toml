[package]
name = "arti-bench"
version = "0.17.0"
edition = "2024"
rust-version = "1.92"
authors = ["The Tor Project, Inc.", "eta <eta@torproject.org>"]
license = "MIT OR Apache-2.0"
homepage = "https://gitlab.torproject.org/tpo/core/arti/-/wikis/home"
description = "A simple benchmarking utility for Arti."
keywords = ["tor", "arti"]
categories = ["asynchronous"]
repository = "https://gitlab.torproject.org/tpo/core/arti.git/"

# This crate is only useful for arti development;
# earlier versions of it were published by accident.
publish = false

[dependencies]
anyhow = "1.0.104"
arti = { path = "../arti", version = "2.7.0", features = ["experimental-api"] }
arti-client = { package = "arti-client", path = "../arti-client", version = "0.47.0" }
clap = { version = "4.6.7", features = ["wrap_help"] }
float-ord = "0.3"
fs-mistrust = { path = "../fs-mistrust", version = "0.16.0" }
futures = "0.3.34"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-socks = "0.5"
tor-config = { path = "../tor-config", version = "0.47.0" }
tor-rtcompat = { path = "../tor-rtcompat", version = "0.47.0", features = ["tokio", "native-tls"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
web-time-compat = { version = "0.3.0", path = "../web-time-compat" }

[features]
full = [
    "arti/full",
    "arti-client/full",
    "fs-mistrust/full",
    "tor-config/full",
    "tor-rtcompat/full",
    "web-time-compat/full",
]
[package.metadata.docs.rs]
all-features = true

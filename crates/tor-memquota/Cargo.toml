[package]
name = "tor-memquota"
version = "0.47.0"
authors = ["The Tor Project, Inc.", "Ian Jackson <iwj@torproject.org>"]
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
homepage = "https://gitlab.torproject.org/tpo/core/arti/-/wikis/home"
description = "Memory use tracking and quota utilities, used by Tor software"
keywords = ["tor", "arti"]
categories = ["memory-management"]
repository = "https://gitlab.torproject.org/tpo/core/arti.git/"

[dependencies]
cfg-if = "1.0.5"
derive-deftly = { version = "~1.14.0", features = ["full", "beta"] }
derive_more = { version = "2.1.1", features = ["full"] }
dyn-clone = "1.0.20"
educe = "0.4.23"
extend = "1.2.0"
futures = "0.3.34"
itertools = "0.15.0"
paste = "1.0.15"
pin-project = "1"
serde = { version = "1.0.229", features = ["derive"] }
slotmap-careful = { path = "../slotmap-careful", version = "0.9.0" }
static_assertions = "1"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
thiserror = "2"
tor-async-utils = { path = "../tor-async-utils", version = "0.47.0" }
tor-basic-utils = { path = "../tor-basic-utils", version = "0.47.0", features = ["serde"] }
tor-config = { path = "../tor-config", version = "0.47.0" }
tor-error = { path = "../tor-error", version = "0.47.0", features = ["tracing"] }
tor-log-ratelim = { path = "../tor-log-ratelim", version = "0.47.0" }
tor-memquota-cost = { path = "../tor-memquota-cost", version = "0.47.0" }
tor-rtcompat = { version = "0.47.0", path = "../tor-rtcompat" }
tracing = "0.1.44"
visibility = { version = "0.1.1", optional = true }
void = "1"

[dev-dependencies]
rand = "0.10.3"
safelog = { path = "../safelog", version = "0.10.0" }
serde_json = "1.0.154"
tor-basic-utils = { path = "../tor-basic-utils", version = "0.47.0" }
tor-rtcompat = { version = "0.47.0", path = "../tor-rtcompat", features = ["tokio", "native-tls"] }
tor-rtmock = { path = "../tor-rtmock", version = "0.47.0" }
tracing-test = "0.2.6"

[features]
full = [
    "memquota",
    "tor-config/full",
    "tor-error/full",
    "tor-log-ratelim/full",
    "tor-rtcompat/full",
    "tor-async-utils/full",
    "tor-basic-utils/full",
    "tor-memquota-cost/full",
    "slotmap-careful/full",
]
default = ["memquota"]
memquota = ["tor-memquota-cost/memquota"]
testing = ["__is_experimental", "visibility"]
experimental = ["testing"]
__is_experimental = []

[package.metadata.docs.rs]
all-features = true

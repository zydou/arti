[package]
name = "tor-dirauth"
version = "0.47.0"
authors = [
    "The Tor Project, Inc.",
    "Ian Jackson <iwj@torproject.org>",
    "Clara Engler <cve@torproject.org>",
]
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
homepage = "https://gitlab.torproject.org/tpo/core/arti/-/wikis/home"
description = "Tor Directory Authority - core algoirithms"
keywords = ["tor", "arti"]
# We must put *something* here and this will do
categories = ["network-programming"]
repository = "https://gitlab.torproject.org/tpo/core/arti.git/"

[package.metadata.docs.rs]
all-features = true

[features]
experimental = []
full = [
    "tor-netdoc/full",
    "tor-error/full",
    "tor-basic-utils/full",
    "tor-checkable/full",
]
__is_experimental = []

[dependencies]
amplify = { version = "4", default-features = false, features = ["derive"] }
derive-deftly = { version = "~1.14.0", features = ["full", "beta"] }
derive_more = { version = "2.1.1", features = ["full"] }
educe = "0.4.23"
extend = "1.2.0"
ipnet = "2.12"
itertools = "0.15.0"
num-traits = "0.2.19"
paste = "1.0.15"
rangemap = "1.8"
static_assertions = "1"
thiserror = "2"
tor-basic-utils = { path = "../tor-basic-utils", version = "0.47.0" }
tor-checkable = { path = "../tor-checkable", version = "0.47.0" }
tor-error = { path = "../tor-error", version = "0.47.0" }
tor-netdoc = { version = "0.47.0", path = "../tor-netdoc", features = ["full", "retain-unknown"] }
tracing = "0.1.44"
typed-index-collections = "3.5.0"

[dev-dependencies]
anyhow = "1.0.104"
tor-netdoc = { version = "0.47.0", path = "../tor-netdoc", features = ["full", "testing"] }
tracing-test = "0.2.6"
